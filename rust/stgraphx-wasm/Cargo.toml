[package]
name = "stgraphx-wasm"
description = "WebAssembly bridge for the STGraphX Rust engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde_json = "1"
stgraphx-engine = { path = "../stgraphx-engine" }
wasm-bindgen = "0.2"
